<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiggy Landing Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main">

        <nav class="navbar">
            <div class="logo">
                <span class="logo-icon">S</span>
                <h2>Swiggy</h2>
            </div>

            <div class="nav-links">
                <a href="#">Swiggy Corporate</a>
                <a href="#">Partner with us</a>
                <a href="#" class="app-btn">Get the App ↗</a>
                <a href="#" class="signin">Sign in</a>
            </div>
        </nav>

        <section class="hero">

            <h1>
                Order food & groceries. Discover<br>
                best restaurants. Swiggy it!
            </h1>
            <div class="search-container">

                <div class="location">
                    <span>📍</span>
                    <input type="text" placeholder="Enter your delivery location">
                    <span>⌄</span>
                </div>

                <div class="search">
                    <input type="text"
                    placeholder="Search for restaurant, item or more">
                    <span>⌕</span>
                </div>

            </div>

            <div class="cards">

                <div class="card">
                    <h2>FOOD DELIVERY</h2>
                    <p>FROM RESTAURANTS</p>
                    <small>UPTO 60% OFF</small>

                    <div class="food-image">🍱</div>

                    <div class="arrow">➜</div>
                </div>

                <div class="card">
                    <h2>INSTAMART</h2>
                    <p>INSTANT GROCERY</p>
                    <small>UPTO 60% OFF</small>

                    <div class="food-image">🛒</div>

                    <div class="arrow">➜</div>
                </div>

                <div class="card">
                    <h2>DINEOUT</h2>
                    <p>EAT OUT & SAVE MORE</p>
                    <small>UPTO 50% OFF</small>

                    <div class="food-image">🍽️</div>

                    <div class="arrow">➜</div>
                </div>

            </div>

        </section>

    </div>

</body>
</html>
